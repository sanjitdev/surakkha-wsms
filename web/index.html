<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Surakkha</title>
    <!-- Pre-paint theme applier — runs before stylesheet to avoid flash. -->
    <script>
      try {
        var t = localStorage.getItem('surakkha.theme');
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
