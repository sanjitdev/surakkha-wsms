name: E2E

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs on the same branch / PR — the Playwright
# suite takes ~90s end-to-end, so a stale PR doesn't waste runner
# minutes. Concurrency group is distinct from CI's so both jobs
# can run in parallel.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # --with-deps installs the system libraries Chromium needs
      # (libnss3, libatk-bridge2.0-0, libxkbcommon0, etc). Without
      # these, browser launch fails with "missing library" errors
      # that only surface on Linux CI runners.
      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      # webServer in playwright.config.ts starts `vite dev` with
      # VITE_USE_MOCKS=true, which boots the MSW service worker
      # in the real Chromium instance. Specs use IndexedDB for
      # session storage — fresh BrowserContext per spec is the
      # isolation boundary, no manual DB cleanup needed.
      - name: Run Playwright
        working-directory: web
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
