name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs on the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Format check
        working-directory: web
        run: pnpm format:check

      - name: Test with coverage
        working-directory: web
        run: pnpm test:coverage

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Upload coverage (HTML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: web/coverage/index.html
          retention-days: 14

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: web/coverage/lcov.info
          retention-days: 14
